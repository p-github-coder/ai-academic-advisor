[project]
name = "academic-advisor"
version = "1.0.0"
description = "Hybrid rule-based and machine-learning academic advisor (CSC 303)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]  # generated by scripts/build_notebook.py

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# Long lines live inside the notebook-cell strings, which are Colab code, not this script.
"scripts/build_notebook.py" = ["E501"]
